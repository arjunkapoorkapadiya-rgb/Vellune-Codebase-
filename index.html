<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        // Prevent third-party browser extensions (e.g. Similarweb frame_ant.js)
        // from crashing when attempting to overwrite a getter-only window.fetch
        try {
          var currentFetch = window.fetch.bind(window);
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function () {
              return currentFetch;
            },
            set: function (fn) {
              if (typeof fn === 'function') {
                currentFetch = fn;
              }
            },
          });
        } catch (_e) {
          // Ignore if environment locks property definition
        }

        window.addEventListener(
          'error',
          function (event) {
            var filename = (event && event.filename) || '';
            var msg = (event && event.message) || '';
            if (
              filename.indexOf('chrome-extension://') === 0 ||
              filename.indexOf('moz-extension://') === 0 ||
              msg.indexOf('Cannot set property fetch of #<Window>') !== -1 ||
              msg.indexOf('signal is aborted without reason') !== -1
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return false;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event && event.reason;
            var msg =
              (reason && (reason.message || String(reason))) || '';
            var name = (reason && reason.name) || '';
            if (
              name === 'AbortError' ||
              msg.indexOf('signal is aborted without reason') !== -1
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return false;
            }
          },
          true
        );
      })();
    </script>
    <title>Vellune — Literary Criticism & Digital Publication</title>
